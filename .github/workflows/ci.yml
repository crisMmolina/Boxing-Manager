# Build y pruebas de core/ (ADR 0001). Debe ser check requerido en la protección de main.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Sin esto, Windows hace checkout de core/gradlew con CRLF y Git Bash no lo puede correr.
      - name: Line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build core
        shell: bash
        run: core/gradlew -p core build
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-reports-${{ matrix.os }}
          path: core/build/reports/
          if-no-files-found: ignore
